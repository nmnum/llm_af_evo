  # =====================================================================
  # ROOT 7 — mo_bo_pipeline (separate repo): LLM pool-seeding investigation
  # =====================================================================
  - id: M01
    type: question
    title: 'Does LLM-informed pool seeding beat random/naive seeding for multi-objective BO under a strict small (~50-eval) budget?'
    provenance: user
    timestamp: '2026-09-05'
    source: 'mo_bo_pipeline/README.md:L1-13'
    children:
      - id: M02
        type: decision
        title: 'Build a noisy synthetic skeleton first, before any real chemistry or LLM call'
        provenance: user
        source: 'mo_bo_pipeline/README.md:L14-35'
        alternatives: ['Wire up real chemistry and the LLM immediately']
        evidence: 'Two hard-earned lessons carried over directly from llm_af_evo (same session): the synthetic oracle must never be noiseless (a noiseless problem is already close to solved by a strong acquisition function, so "it works" proves nothing about the real noisy pipeline), and its ground truth must be an actually smooth function of category embeddings (a fixed random linear projection + ZDT1-style transform), not pure per-category noise, so the GP can genuinely learn structure.'
        also_depends_on: [N56]
      - id: M03
        type: experiment
        title: 'Synthetic skeleton validated end-to-end'
        provenance: user
        source: 'mo_bo_pipeline/FINDINGS.md:section 1'
        result: 'Bad dimension/budget ratio (32D, budget 15): BO 1.18 vs random 1.22 — statistically indistinguishable, as expected (~5-10 points can''t inform a 32D kernel). Good ratio (18D, budget 50): BO 2.03 vs random 1.68 — BO clearly ahead. Validates the BoTorch/qLogNEHVI core loop, categorical embedding, and decision/feature-space assembly mechanics only, not anything about real chemistry.'
      - id: M04
        type: dead_end
        title: 'LLM chemistry seeding vs. a self-authored synthetic oracle — abandoned for circularity'
        provenance: user
        source: 'mo_bo_pipeline/FINDINGS.md:section 2'
        hypothesis: 'A hand-authored mAb-like excipient domain with reasoned Pareto-seed formulations can test whether "LLM chemistry seeding" beats naive Sobol seeding.'
        failure_mode: 'llm_seeded_bo (1.78) < sobol_seeded_bo (2.34) < even sobol_seeded_random (1.84) — but since the oracle''s ground truth and the seeding heuristic were both authored by the same reasoning process, this can only demonstrate self-consistency, not real-world validity. Caught before over-interpreting: this is not "LLM chemistry seeding doesn''t help," it is "this test cannot tell us that."'
        lesson: 'Any oracle whose ground truth and seeding heuristic are authored by the same reasoning process is circular by construction — abandon it in favour of independently-collected real data.'
      - id: M05
        type: experiment
        title: 'Waibel et al. 2025 real mAb data (33 formulations) transcribed as a pool-based oracle'
        provenance: user
        source: 'mo_bo_pipeline/FINDINGS.md:section 3'
        result: '33 real formulations transcribed from the paper''s own SI (pasted directly by the user after automated fetch attempts hit paywalls/bot-protection); objectives Tm/kD/RMAgi with real per-point SE from reported CIs.'
        children:
          - id: M06
            type: experiment
            title: 'Prior-belief check: the pre-Waibel arginine prior is WRONG for this molecule'
            provenance: user
            source: 'mo_bo_pipeline/FINDINGS.md:section 3a'
            result: 'A clean, uncontaminated prior (mab_placeholder_domain''s belief that arginine is broadly beneficial, encoded with no knowledge of this dataset) checked against real Waibel correlations: Spearman(arginine_mM, objective) = -0.731 (Tm), -0.815 (kD), -0.713 (RMAgi) — all strongly negative, i.e. the opposite of the prior. Note: the paper''s own reported Fig S11 values (-0.31/-0.94/-0.94) are directionally consistent but not numerically matching; spot-checked against two landmark formulations and confirmed correct, so the discrepancy is left unresolved rather than glossed over as a transcription error.'
          - id: M07
            type: experiment
            title: 'Waibel pool-based campaign replay'
            provenance: user
            source: 'mo_bo_pipeline/FINDINGS.md:section 3b'
            result: 'our_bo and our_random both reveal a better early Pareto front than the real published sequence (round 1: published=47549, our_bo=65883, our_random=55545), with our_bo ahead of our_random. All three converge to the same final HV (74344) because the 33-point pool gets fully exhausted by round 4 for every strategy — explicitly flagged as a pool-exhaustion artifact, not a finding. n=1 per condition, one fixed real init set.'
      - id: M08
        type: experiment
        title: 'AgNP real data validation (132 rows, original EGBO paper) — reproduces the paper''s own finding, but our_bo''s edge is confounded'
        provenance: user
        source: 'mo_bo_pipeline/FINDINGS.md:section 4'
