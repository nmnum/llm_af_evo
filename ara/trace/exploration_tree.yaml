      - id: N94
        type: experiment
        title: 'Qualitative code-log analysis: only 3 structurally distinct implementations across 18 approach_c/c_evo calls'
        provenance: user
        source: 'sdl_adaptive/approach_c_qualitative_analysis.md:L13-24,72-77'
        result: 'Generation A (plain GP-UCB, 2/18 calls), Generation B (adds evolutionary/novelty machinery but re-runs a redundant second candidate pool, 12/18 calls, all structurally identical to each other), Generation C (collapses the two redundant blocks into one, 4/18 calls). 12 of 18 calls are exact duplicates; the LLM iterated only once further across 18 independent rewrite calls — near-total code stagnation. beta=2.0 hardcoded in all 18 versions with no decay schedule ever explored.'
        children:
          - id: N95
            type: dead_end
            title: 'Dead-acquisition-score bug: evolutionary candidates scored zero in 16/18 approach_c_evo logs'
            provenance: ai-executed
            source: 'sdl_adaptive/approach_c_qualitative_analysis.md:L26-36'
            hypothesis: 'Evolutionary candidates merged into the scoring pool are ranked fairly alongside GP candidates.'
            failure_mode: 'acq_scores = np.concatenate([gp_scores, np.zeros(72)]) — the LLM''s own comment ("dummy scores for evo candidates") shows it knew this was a stand-in, and it was never fixed across 16 subsequent identical or near-identical calls. novelty_select(merit_weight=0.7) then means evolutionary candidates can only ever be selected on the 0.3-weighted novelty term, structurally starved regardless of how promising they actually are.'
            lesson: 'The LLM can and does ship silent, self-introduced regressions in its own generated code without catching them across repeated calls — a real, causal, and repeated failure mode, distinct from whether the overall approach is competitive.'
