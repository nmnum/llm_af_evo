          - id: M13
            type: dead_end
            title: 'AgNP 15-seed test completely reverses the single-seed result'
            provenance: ai-executed
            source: 'mo_bo_pipeline/FINDINGS.md:section 5c'
            hypothesis: 'The single-seed +15.5% AgNP advantage (M12) reflects a real, if fading, LLM benefit.'
            failure_mode: 'At 15 seeds: llm_init round-0 HV=0.00603±0.00175 vs random=0.00801±0.00165 — a SIGNIFICANT NEGATIVE effect (-23.3%; paired t-test p=0.0022, Wilcoxon p=0.0026), LLM beat random in only 3/15 seeds. Cause: index 20 appears in the LLM''s selection in 15/15 seeds and indices 97/131/79 in 13/15 — the LLM''s reasoning collapses to nearly the same fixed picks regardless of seed, and here that confident fixed pick is a genuinely bad region of the space. The single-seed run (M12) missed this because seed 42 happened to land in the one favourable tail of a distribution centred well below zero.'
            lesson: 'This is the clearest illustration in the whole project of why n=1 anecdotes are dangerous — the single-seed AgNP number was not just unproven, it actively pointed the wrong direction.'
            also_depends_on: [M12]
          - id: M14
            type: dead_end
            title: 'List-position artifact discovered: both the Waibel positive and AgNP negative effects are the same confound, retracted'
            provenance: ai-executed
            source: 'mo_bo_pipeline/FINDINGS.md:section 5d; "Overall verdict" section'
            hypothesis: 'The LLM''s enumerated-list index picks in M11/M13 reflect genuine content/chemistry reasoning.'
            failure_mode: 'A blank-vs-domain-knowledge ablation (unshuffled) found 14/15 AgNP seeds pick byte-identical indices whether given real chemistry text or a blank prompt — the domain text does essentially nothing. A shuffled-presentation-order control then showed shown_positions clustering tightly around 0.6-0.7 regardless of which real candidates land there — a textbook list-boundary/recency artifact. Under shuffling, AgNP''s -23.3% harm disappears into noise (mean -4.8%, LLM wins 8/15, chance level) and Waibel''s +7.1% "significant" advantage also disappears (mean -2.3%, t-test p=0.51, Wilcoxon p=0.49).'
            lesson: 'Both of the original "real" effects — Waibel positive and AgNP negative — were artifacts of presenting a long candidate list in a fixed order, not the LLM applying domain knowledge; retracted as evidence about LLM domain reasoning. Always shuffle candidate-list presentation order (and report shown_positions) before trusting any LLM list-pick claim. Described in FINDINGS.md as arguably the single most important methodological finding of the whole project, precisely because it is a null reached by actually checking rather than stopping at a flattering number.'
            also_depends_on: [M11, M13]
      - id: M15
        type: experiment
        title: 'Corrected re-test with shuffling default: domain-knowledge vs blank vs random, both datasets'
        provenance: user
