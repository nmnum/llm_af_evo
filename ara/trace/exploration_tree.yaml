                also_depends_on: [N95]
              - id: N97
                type: pivot
                title: 'Live rerun overturns the "approach_c_evo is the weakest LLM condition" narrative'
                provenance: ai-executed
                source: 'sdl_adaptive/approach_c_qualitative_analysis.md:L42-70'
                trigger: 'The 0.708 figure that motivated the whole bug investigation came from results_power2: 80 seeds on a single dataset (pareto_20210112), not comparable to the 20-seed x 5-dataset protocol used for approach_a/b/c/d.'
                rationale: 'A fair, matching-protocol live rerun (real qwen3-coder:30b calls, fresh code per seed, 20 seeds x 5 datasets) shows approach_c_evo is not, on average, the weakest LLM condition — it is the STRONGEST one (mean AUC 0.851, ahead of approach_a 0.842, approach_c 0.840, approach_b 0.833, approach_d 0.818), and on pareto_20201218 it edges out both EGBO baselines narrowly (0.851 vs egbo''s 0.850 and novelty_egbo''s 0.849). The dead-acquisition-score bug (N95) is real and repeated in the saved snapshots inspected, but the LLM does not reliably reproduce that exact bug across independent live generations — both findings are true and worth reporting together, not in tension.'
                also_depends_on: [N88, N96]

