                failure_mode: 'A power diagnostic against v5''s real run1+run2 history found only 1 of 8 "improving" fitness events across 300 generations was distinguishable from noise — mostly a signal problem, not just a formula problem. The std penalty also duplicates the gate''s harm-prevention job in the wrong direction (punishes upside variance among already-safe candidates) and conflates domain-intrinsic noise scale with genuine cross-domain inconsistency.'
                lesson: 'Use a unit-free, per-domain z-scored fitness (mean of score/SE per domain) instead — verified against real v5 run2 gen81/gen114 data: the old formula picks gen114 (the actual, buggy outcome); the z-scored formula correctly flips to gen81.'
                also_depends_on: [N75]
      - id: N77
        type: decision
        title: 'v6: bundle noisy-synthetic substrate, delta-seed contract, and z-scored fitness'
        provenance: user
        timestamp: '2026-09-05'
        source: 'commit:d5eaf8d; commit:9f5456a'
        alternatives: ['Continue with noiseless synthetics (blocked by the floor rule, N56)', 'Continue with real mAb/coatings data (too low signal-to-noise at affordable campaign counts)']
        evidence: 'Noisy-synthetic substrate (ZDT1@15%CV, DTLZ2-3obj@30%CV, ZDT3@50%CV, held-out DTLZ2-5obj@35%CV) sidesteps both known failure modes. Delta-seed contract: modifier(context) returns only a correction term, with the sandbox structurally adding context[pool][i][acq_value_norm] itself (not a convention) — motivated by every real v5 champion turning out to be acq_value_norm plus a small correction anyway (N73).'
        also_depends_on: [N56, N73, N76]
        children:
          - id: N78
            type: dead_end
            title: 'v6 run1: classic overfitting signature despite the noisy-substrate + z-scored fixes'
            provenance: ai-executed
            timestamp: '2026-09-05'
            source: 'commit:d5eaf8d'
            hypothesis: 'Noisy-synthetic substrate plus z-scored fitness (N77) is sufficient to fix cross-domain generalization.'
            failure_mode: 'Champion locked in at generation 10, flat for 40 generations. Held-out validation: positive only on the training domain it fit best (dtlz2_3obj, +1.75%), negative on the other two training domains AND the never-trained-on target (dtlz2_5obj, ci_lower -3.21%).'
            lesson: 'Per the GP-generalization literature (interleaved/random fitness-case sampling, down-sampled lexicase selection): a STATIC training set scored the same way every generation is exactly the regime that breeds overfitting, regardless of how the fitness score itself is computed.'
            children:
              - id: N79
                type: experiment
                title: 'v7: per-generation resampling fix'
                provenance: ai-executed
                timestamp: '2026-09-05'
                source: 'commit:e78b1d8'
                result: 'resample_domain_configs_for_gen draws a fresh, deterministic K=3-per-domain subset every generation; the entire population is re-scored fresh each generation (not just new children) since v6''s elitist-persistent fitness storage becomes wrong once the training subsample itself moves. Held-out margin on the never-trained target (dtlz2_5obj) improved from ci_lower -3.21% (v6) to ci_lower -1.29% (v7) — statistically indistinguishable from baseline — but the champion still does not beat baseline outright, just no longer clearly loses.'
                also_depends_on: [N78]
              - id: N80
                type: dead_end
                title: 'population[0] at the final generation is not necessarily the best individual over the run'
                provenance: ai-executed
                timestamp: '2026-09-05'
                source: 'commit:e78b1d8'
                hypothesis: 'The top-ranked individual in the final generation''s population is the best AF the run found.'
                failure_mode: 'Under per-generation resampling, real run1 fitness swung from ~-1,000,001 to +51 to +1.78 generation to generation purely from resampling noise — population[0] at the end is just whoever won that generation''s random draw.'
                lesson: 'Re-score the final population against the FULL campaign pool before validation as a required step, not optional polish — in real run1, 11 of 12 final-population members failed this full-pool gate outright.'
                also_depends_on: [N79]
              - id: N81
                type: pivot
                title: 'Recommend against further generations of the same v6/v7 setup'
                provenance: user
                timestamp: '2026-09-05'
                source: 'commit:e78b1d8'
                trigger: 'Two full runs (v6, v7), with the measurement problem (N76) and the overfitting problem (N78) each diagnosed and fixed in turn, converge on the same ceiling: the champion no longer clearly loses on held-out data, but never beats baseline outright either.'
                rationale: 'More generations of an already-converged setup is not the recommended next move; the finding is treated as a real ceiling of this design, not a not-yet-converged run.'
                also_depends_on: [N79, N80]

