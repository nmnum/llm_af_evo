            result: 'Waibel/domain(mab): n=15, -16.0% (t p=0.027, Wilcoxon p=0.030, 4/15 wins). Waibel/blank: n=15, -23.9% (t p=0.001, Wilcoxon p=0.001, 2/15 wins). AgNP/domain: n=15, -6.4% (p=0.181/0.229, 6/15, not significant); extended to n=60 later (see M21). AgNP/blank: n=15, +1.1% (p=0.698/0.934, 8/15). Waibel is significant in BOTH conditions and in the direction of the LLM doing worse than random — present with or without domain-knowledge text, so it is not "wrong domain knowledge" driving it. This is the first result in the whole section that survives its own methodology (the format change specifically designed to remove the list artifact), and it is a negative one, still unexplained at this point.'
            also_depends_on: [M17]
            children:
              - id: M19
                type: experiment
                title: 'Root-cause investigation of the Waibel/AgNP split: mechanisms 1-3'
                provenance: user
                source: 'mo_bo_pipeline/FINDINGS.md:section 5g, follow-up points 1-3'
                result: '(1) Centroid proximity — wrong direction and true on BOTH datasets equally (LLM points farther from centroid than random, Waibel 3.15 vs 2.39 p<1e-4, AgNP 2.48-2.49 vs 2.08 p<1e-4) — ruled out as the differentiator. (2) Per-objective extremeness — LLM sets reach significantly fewer per-objective extremes than random on BOTH datasets (Waibel p=0.0003-0.008, AgNP p=0.001-0.002, AgNP''s effect if anything larger) — a real, consistent selection bias, but again moves the same way on both datasets so does not explain why only Waibel''s HV effect is significant. (3) Baseline sampling noise — the actual differentiator candidate: random-baseline round-0 HV coefficient of variation is Waibel CV=0.082 vs AgNP CV=0.207 (~2.5x noisier), consistent with — not yet full proof of — why the same underlying selection bias clears significance on Waibel but is swallowed by AgNP''s noisier baseline.'
                also_depends_on: [M18]
                children:
                  - id: M20
                    type: dead_end
                    title: 'Coverage-ratio hypothesis for the split falsified by direct ablation'
                    provenance: ai-executed
                    source: 'mo_bo_pipeline/FINDINGS.md:section 5g, follow-up point 6'
                    hypothesis: 'AgNP''s null is a real signal masked by its lower fractional pool-coverage (12/132≈9%) relative to Waibel''s (13/33≈39%), so matching AgNP''s coverage ratio on Waibel''s own real selections should wash out Waibel''s significant effect.'
                    failure_mode: 'Part 1 confirmed coverage ratio is a real, transferable noise lever (sweeping n_init on Waibel''s own pool from 13→3 raises CV from 0.094 to 0.386, and at matched n=3 coverage Waibel is actually NOISIER than AgNP''s 0.309). But Part 2 — resampling random size-k subsets of the real, already-collected llm/random indices at AgNP-matched coverage (k=3), repeated 300 trials — found the effect does NOT wash out: still significant in 283/300 trials (blank) and 151/300 (domain), if anything STRONGER at lower coverage, the opposite of dilution.'
                    lesson: 'The coverage-ratio mechanism is real but insufficient alone to explain the split — something dataset-specific (most likely which particular points are HV-critical on each dataset''s Pareto geometry) distinguishes Waibel from AgNP, not a sample-size/noise-floor difference. Flagged as the next thread if worth fully closing, not yet tested further.'
                    also_depends_on: [M19]
                  - id: M21
                    type: experiment
                    title: 'Direct test of the AgNP-underpowered hypothesis at n=60 — falsified'
                    provenance: user
                    source: 'mo_bo_pipeline/FINDINGS.md:section 5g, follow-up point 5'
                    result: 'A power calculation from the original 15-seed AgNP-domain read (d≈0.36, -6.4%) suggested ~60 seeds should reveal a real effect if the original read was an underpowered detection of it. 45 more AgNP-domain seeds run: the NEW 45 alone came back POSITIVE (+7.3%, 24/45 wins) — the opposite sign — and the full pooled 60-seed sample is a clean null (mean +3.9%, paired t-test p=0.43, wins 30/60). Conclusion: the original 15-seed -6.4% read was itself mostly noise, not a real effect sitting below detection threshold; extrapolating a required sample size from it was circular. AgNP''s null is a genuine null, not underpowered detection of Waibel''s bias.'
                    also_depends_on: [M19]
      - id: M22
        type: decision
        title: 'Overall verdict on LLM pool seeding: two task formats tried, both properly controlled — one still-unexplained negative result stands'
        provenance: user
        source: 'mo_bo_pipeline/FINDINGS.md: "Overall verdict on LLM pool seeding" and "Standing caveats" sections'
        alternatives: ['Conclude "LLM pool seeding doesn''t work" as a general claim', 'Report only the retracted list-based positive result and stop there']
        evidence: 'Index-selection format (M10-M16, list-position artifact found and fixed in M14): no effect, positive or negative, on either real dataset once controlled. Propose-and-snap format (M17-M21), which structurally avoids the list artifact by construction: no effect on AgNP, but a significant NEGATIVE effect on Waibel present in both domain and blank conditions — the LLM''s proposals, once snapped to the real pool, initialize worse than random, and this is NOT root-caused (mechanism-2''s per-objective-extremeness bias is measurable on both datasets but the coverage-ratio explanation for why only Waibel clears significance was directly falsified, M20). As of this writing: no positive LLM-seeding result has survived scrutiny anywhere in either real dataset/task-format combination tested, and exactly one negative one has, on one dataset, in one format, not yet explained.'
        also_depends_on: [M18, M20, M21]
        claims_touched: ['mo_bo_pipeline LLM pool-seeding thesis question']

