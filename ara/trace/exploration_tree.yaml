      - id: M17
        type: decision
        title: 'Task-format redesign: propose-and-snap instead of index-selection from an enumerated list'
        provenance: user
        source: 'mo_bo_pipeline/FINDINGS.md:section 5g'
        alternatives: ['Keep the index-selection format and try yet another model', 'Conclude the null result is final without testing task format']
        evidence: 'Index-selection structurally cannot rule out a residual list-position effect even when shuffled, since the LLM still only ever reasons over positions in a list. llm_pool_propose.py has the LLM propose real feature values from scratch (same design as llm_af_evo''s llm_warmstart.py), snapped afterward — ordinary numpy nearest-neighbour outside the LLM call — to the nearest real pool point, structurally unable to leak a list-order signal.'
