        result: 'All four conditions are a clean null (n=15 each): Waibel/mAb-knowledge -2.3% (t p=0.509, W p=0.489, 5/15 wins); Waibel/blank -6.5% (p=0.233/0.389, 6/15); AgNP/colloidal-knowledge -4.8% (p=0.634/0.720, 8/15); AgNP/blank -2.1% (p=0.835/0.934, 8/15). Domain knowledge and a blank prompt are indistinguishable from each other AND from random on both real datasets — the properly-controlled version of the project''s founding question, with an honest null answer at this sample size and model.'
