      - id: M16
        type: experiment
        title: 'Reasoning-model (think=True) retest — still no effect, catches a second real bug'
        provenance: user
        source: 'mo_bo_pipeline/FINDINGS.md:section 5f'
        result: 'qwen3:14b with think=True, num_ctx=8192, shuffling on. First 8-seed batch: 5-8/8 seeds per dataset burned the entire num_predict=2048 budget on the reasoning trace before reaching the JSON answer, silently falling back to the non-LLM diversity heuristic — that batch was discarded as measuring the fallback, not the model. Fixed by raising num_predict to 6144 for think=True (now the default). Clean rerun (0/15 and 1/15 fallback): Waibel think=True -11.0% (t p=0.067, borderline trend toward WORSE, not the hoped-for improvement); AgNP think=True +10.7% (p=0.305, noisy, not remotely significant). Model choice (reasoning vs non-reasoning) does not resolve the null from M15.'
